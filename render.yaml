services:
  - type: web
    name: cluster
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    repo: https://github.com/GouthamJosh/Botclusters
    env: docker
    envVars:
      - key: CLUSTER_01
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    autoDeploy: false
